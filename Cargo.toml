[workspace]
members = [
    "crates/kid-rom",
    "crates/kid-md",
    "crates/kid-data",
    "crates/kid-core",
    "crates/kid-render",
    "crates/kidcli",
    "crates/ymfm-sys",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.98"
clap = { version = "4.5.32", features = ["derive"] }
crc32fast = "1.4"
cc = "1.2.37"
hound = "3.5.1"
image = { version = "0.25.8", default-features = false, features = ["png"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_yaml = "0.9"
sha1 = "0.10.6"
tempfile = "3.19.1"
criterion = { version = "0.5", features = ["html_reports"] }
rayon = "1.10"
thiserror = "2.0.12"
ratatui = "0.29"
crossterm = "0.28"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

# --- Permanent allows (emulator domain) ---

# Casts — emulator code does intentional width/sign/wrap casts everywhere
cast-lossless             = "allow"
cast-possible-truncation  = "allow"
cast-precision-loss       = "allow"
cast-sign-loss            = "allow"
cast-possible-wrap        = "allow"

# Naming — hardware register names, coordinate pairs, hex addresses
module-name-repetitions   = "allow"
similar-names             = "allow"
unreadable-literal        = "allow"
struct-field-names         = "allow"

# Documentation — register names in doc comments trigger doc_markdown
doc-markdown              = "allow"
missing-errors-doc        = "allow"
missing-panics-doc        = "allow"

# Low signal in this codebase
must-use-candidate        = "allow"
wildcard-imports          = "allow"
struct-excessive-bools    = "allow"
match-same-arms           = "allow"   # intentional in dispatch tables
items-after-statements    = "allow"   # common in test code
bool-to-int-with-if       = "allow"   # idiomatic for bit manipulation
too-many-lines            = "allow"   # faithful ASM translations
float-cmp                 = "allow"   # emulator fixed-point comparisons

# _root: TempDir drop guards are intentionally underscore-prefixed but used
used-underscore-binding            = "allow"
# Every workspace-level allow triggers this lint; noise
allow-attributes-without-reason    = "allow"
# Game engine APIs with multiple independent bool flags
fn-params-excessive-bools          = "allow"

[workspace.lints.rust]
unsafe_code = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
