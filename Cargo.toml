[workspace]
members = [
    "crates/kid-rom",
    "crates/kid-md",
    "crates/kid-data",
    "crates/kid-core",
    "crates/kid-render",
    "crates/kidcli",
    "crates/ymfm-sys",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.98"
clap = { version = "4.5.32", features = ["derive"] }
crc32fast = "1.4"
cc = "1.2.37"
hound = "3.5.1"
image = { version = "0.25.8", default-features = false, features = ["png"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_yaml = "0.9"
sha1 = "0.10.6"
tempfile = "3.19.1"
criterion = { version = "0.5", features = ["html_reports"] }
rayon = "1.10"
thiserror = "2.0.12"
ratatui = "0.29"
crossterm = "0.28"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
