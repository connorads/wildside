[workspace]
members = ["crates/kid-rom", "crates/kid-md", "crates/kidcli"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.98"
clap = { version = "4.5.32", features = ["derive"] }
image = { version = "0.25.8", default-features = false, features = ["png"] }
sha1 = "0.10.6"
tempfile = "3.19.1"
thiserror = "2.0.12"
