[tools]
python = "3.14.3"
rust = "1.94.0"
hk = "1.38.0"
pkl = "0.31.0"
# SDL2 0.38.0's CMakeLists.txt needs cmake_minimum_required < 3.5 compat (dropped in cmake 4.x)
cmake = "3.30.9"

[tasks.fmt]
run = "cargo fmt --all"

[tasks.lint]
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.test]
run = "cargo test --workspace"

[tasks.verify-rom]
run = "cargo run -p kidcli -- verify-rom"

[tasks.play]
run = "cargo run --release -p kidcli -- play"

[tasks.play-native]
run = "cargo run --release -p kidcli -- play-native"

[tasks.probe-cpu]
run = "cargo run -p kidcli -- probe-cpu"

[tasks.verify-boot]
run = "cargo run -p kidcli -- verify-boot"

[tasks.verify-startup]
run = "cargo run -p kidcli -- verify-startup"

[tasks.verify-level]
run = "cargo run -p kidcli -- verify-level"

[tasks.verify-gameplay]
run = "cargo run --release -p kidcli -- verify-gameplay --all"

[tasks.verify-slice-fast]
run = "cargo test -q -p kid-core timing_regression_ && cargo test -q -p kid-core determinism_ && cargo test -q -p kidcli gameplay_regression_"

[tasks.verify-slice-full]
run = "cargo test -q -p kid-core && cargo test -q -p kidcli && cargo run -q -p kidcli -- compare-native-gameplay --scenario pause-resume-level1 && cargo run -q -p kidcli -- compare-native-gameplay --scenario progress-two-transitions && KID_NATIVE_GENERATED_LEVEL_LAYOUT=1 cargo run -q -p kidcli -- compare-native-gameplay --scenario death-respawn-level1"

[tasks.release-gate]
run = "cargo run --release -p kidcli -- release-gate --target 1p-accurate"
description = "Canonical 1P-accurate release gate: bootstrap, gameplay compares, frame/audio oracle, full state sweep"

[tasks.verify-audio-driver]
run = "cargo run -p kidcli -- verify-audio-driver"

[tasks.verify-audio-output]
run = "cargo run -p kidcli -- verify-audio-output --scenario boot-title-start-level1"

[tasks.verify-frames]
run = "cargo run -p kidcli -- verify-frames --scenario boot-title-start-level1-move-right5s"

[tasks.verify-oracle]
run = "cargo run -p kidcli -- verify-oracle --scenario boot-title-start-level1"

[tasks.render-frame]
run = "cargo run --release -p kidcli -- render-frame --steps 2000000 --out .cache/title-frame.png"

[tasks.run-sdl]
run = "cargo run --release -p kidcli -- run-sdl"

[tasks.dump-audio]
run = "cargo run -p kidcli -- dump-audio --scenario boot-title-start-level1 --out .cache/audio.wav"

[tasks.bootstrap-upstream]
run = "cargo run -p kidcli -- bootstrap-upstream"

[tasks.bootstrap-references]
run = "cargo run -p kidcli -- bootstrap-references"

[tasks.oracle-setup]
run = "cargo run -p kidcli -- oracle-setup"

[tasks.extract-assets]
run = "cargo run -p kidcli -- extract-assets"

[tasks.reference-build]
run = "cargo run -p kidcli -- reference-build"

[tasks.dump-level-layout]
run = "cargo run -p kidcli -- dump-level-layout --level ${1:-00}"

[tasks.sweep]
run = "cargo run --release -p kidcli -- sweep"
description = "Sweep all 105 levels for native vs oracle parity"

[tasks.warm-cache]
run = "cargo run --release -p kidcli -- sweep --warm-cache-only"
description = "Pre-populate oracle cache for all levels (no native comparison)"

[tasks.perf-baseline]
run = "cargo bench -p kid-core --bench frame_step"
description = "Run performance benchmarks (criterion); results in target/criterion/"

[tasks.sweep-gameplay]
run = "cargo run --release -p kidcli -- sweep --levels 0-104 --tier gameplay"
description = "Self-consistency gameplay sweep: walk-right + jump + stomp on all 69 BCD levels"

[tasks.collect-metrics]
run = """
mkdir -p .cache/metrics
echo "$(date -Iseconds) test_count=$(cargo test --workspace 2>&1 | grep -oP '\\d+ passed' | awk '{s+=int($1)}END{print s}') sweep_pass=$(cargo run --release -p kidcli -- sweep --levels 0-104 --tier state 2>&1 | grep -oP '\\d+ passed' | head -1 | awk '{print $1}') gameplay_pass=$(cargo run --release -p kidcli -- sweep --levels 0-104 --tier gameplay 2>&1 | grep -oP '\\d+ passed' | head -1 | awk '{print $1}') todo_fidelity=$(grep -r 'TODO(fidelity)' crates/ | wc -l) deviation=$(grep -r 'DEVIATION:' crates/ | wc -l)" >> .cache/metrics/history.log
tail -1 .cache/metrics/history.log
"""
description = "Collect sweep/test/annotation metrics to .cache/metrics/history.log"

[tasks.import-tas]
run = "cargo run -p kidcli -- import-tas --bk2 ${1:?usage: mise run import-tas <path.bk2>}"
description = "Import a BK2 TAS recording as a DynamicScenario JSON"

[tasks.verify-tas]
run = "cargo run --release -p kidcli -- verify-tas --scenario ${1:?usage: mise run verify-tas <scenario.json>}"
description = "Verify a TAS scenario against the oracle (native vs emulator)"

[tasks.verify-tas-frontier]
run = """
set -e
FRONTIER=tests/tas_frontier.json
if [ ! -f "$FRONTIER" ]; then echo "missing $FRONTIER"; exit 1; fi
FAIL=0
for slug in $(jq -r '.recordings | keys[]' "$FRONTIER"); do
  scenario=$(jq -r ".recordings[\"$slug\"].scenario" "$FRONTIER")
  frame=$(jq -r ".recordings[\"$slug\"].frontier_frame" "$FRONTIER")
  echo "checking $slug up to frame $frame..."
  if ! cargo run --release -q -p kidcli -- verify-tas --scenario "$scenario" --frame-end "$frame"; then
    echo "FAIL: $slug regressed before frame $frame"
    FAIL=1
  fi
done
if [ "$FAIL" -eq 1 ]; then echo "TAS frontier regression detected"; exit 1; fi
echo "TAS frontier: all recordings pass"
"""
description = "Verify no TAS regression before current frontier frame"

[tasks.frontier-status]
run = "python3 scripts/frontier_status.py"
description = "Print the live source-port frontier, rejected hypotheses, and next verification commands"

[tasks.audit-debug-fields]
run = "python3 scripts/audit_debug_fields.py"
description = "Check that emitted debug fields are registered and stale candidates are promoted or exempted"
