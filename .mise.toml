[tools]
python = "3.14.3"
rust = "1.94.0"

[tasks.fmt]
run = "cargo fmt --all"

[tasks.lint]
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.test]
run = "cargo test --workspace"

[tasks.verify-rom]
run = "cargo run -p kidcli -- verify-rom"

[tasks.probe-cpu]
run = "cargo run -p kidcli -- probe-cpu"

[tasks.verify-boot]
run = "cargo run -p kidcli -- verify-boot"

[tasks.verify-startup]
run = "cargo run -p kidcli -- verify-startup"

[tasks.verify-level]
run = "cargo run -p kidcli -- verify-level"

[tasks.verify-audio-driver]
run = "cargo run -p kidcli -- verify-audio-driver"

[tasks.verify-audio-output]
run = "cargo run -p kidcli -- verify-audio-output --scenario boot-title-start-level1"

[tasks.verify-frames]
run = "cargo run -p kidcli -- verify-frames --scenario boot-title-start-level1-move-right5s"

[tasks.verify-oracle]
run = "cargo run -p kidcli -- verify-oracle --scenario boot-title-start-level1"

[tasks.render-frame]
run = "cargo run -p kidcli -- render-frame --steps 2000000 --out .cache/title-frame.png"

[tasks.run-sdl]
run = "cargo run -p kidcli -- run-sdl"

[tasks.dump-audio]
run = "cargo run -p kidcli -- dump-audio --scenario boot-title-start-level1 --out .cache/audio.wav"

[tasks.bootstrap-upstream]
run = "cargo run -p kidcli -- bootstrap-upstream"

[tasks.oracle-setup]
run = "cargo run -p kidcli -- oracle-setup"

[tasks.reference-build]
run = "cargo run -p kidcli -- reference-build"
