[tools]
python = "3.14.3"
rust = "1.94.0"
hk = "1.38.0"
pkl = "0.31.0"
# SDL2 0.38.0's CMakeLists.txt needs cmake_minimum_required < 3.5 compat (dropped in cmake 4.x)
cmake = "3.30.9"
typos = "1"
"cargo:cargo-deny" = "0"
"cargo:cargo-machete" = "0"
# Exact pin: must match the wasm-bindgen crate version in crates/wildside-web/Cargo.toml
# or the tool refuses the module. Bump both together.
"cargo:wasm-bindgen-cli" = "0.2.126"
# ymfm-sys needs zig's clang + bundled wasm32-wasi libc++ to compile the C++
# for the web build (#20); see crates/ymfm-sys/build.rs.
zig = "0.14"

[tasks.fmt]
run = "cargo fmt --all"

[tasks.lint]
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.setup]
# Wire the tracked hk pre-commit shim. core.hooksPath is local git state (not
# tracked), so this runs once per clone and once per `wt-add` worktree. Relative
# path so each worktree resolves its own .hk-hooks/pre-commit.
run = "git config core.hooksPath .hk-hooks"
description = "Wire the pre-commit hook (clippy/fmt/deny/tests) for this clone/worktree"

[tasks.check-hooks]
run = "scripts/check-hooks.sh"
description = "Fail closed unless the hk pre-commit hook is wired (run: mise run setup)"

[tasks.machete]
run = "cargo machete"
description = "Detect unused crate dependencies (cargo-machete)"

[tasks.test]
run = "scripts/strict-rust.sh cargo test --workspace"

[tasks.play]
run = "cargo run --release -p wildside-cli -- play"

[tasks.play-native]
run = "cargo run --release -p wildside-cli -- play-native"

[tasks.bootstrap-native]
run = """
sh -ec '
cargo run -p wildside-cli -- extract-assets
for level in 00 01 02; do
  cargo run -p wildside-cli -- dump-level-layout --level "$level"
done
'
"""
description = "Prepare native-play assets plus early gameplay level-layout dumps for levels 00-02"

[tasks.probe-cpu]
run = "cargo run -p wildside-cli -- probe-cpu"

[tasks.verify-gameplay]
run = "scripts/strict-rust.sh cargo run --release -p wildside-cli -- verify-gameplay --all"

[tasks.verify-slice-fast]
depends = [
  "check-hooks",
  "lint",
  "verify-tas-frontier",
  "backlog-lint",
  "audit-debug-fields",
  "asm-coverage-check-required",
  "asm-coverage-check-no-new-test-only",
]
# `check-hooks` makes the gate refuse to pass on a clone/worktree where the
# pre-commit hook isn't wired (run: mise run setup) — fail-closed, near-instant.
# `lint` (cargo clippy --workspace --all-targets -- -D warnings) is a direct dep,
# so clippy warnings fail the gate here regardless of hook state — this covers the
# manual `mise run verify-slice-fast` path agents run at step 7, not just the
# pre-commit hook. No scripts/strict-rust.sh on the test body below: RUSTFLAGS=-D
# warnings would fork a separate build cache, and clippy already denies every
# rustc warning over the same scope (lints are clippy's job). Sharing the plain
# debug target dir lets the clippy and test caches converge. (#24)
run = """
sh -ec '
cargo test -q -p wildside-core --lib -- --skip demo_ --skip published_tas --skip snapshot \
  && cargo test -q -p wildside-cli gameplay_regression_
'
"""
description = "Canonical green-gate: wildside-core unit sweep + wildside-cli gameplay regressions + TAS frontier replay. Must pass at every commit."

[tasks.verify-1p-playable]
run = "scripts/strict-rust.sh cargo run --release -p wildside-cli -- release-gate --target 1p-playable"
description = "Native 1P-playable smoke gate: boot flow, level progress, death/respawn, slopes, and common bounce/block interactions"

[tasks.release-gate]
run = "scripts/strict-rust.sh cargo run --release -p wildside-cli -- release-gate --target 1p-accurate"
description = "Canonical 1P-accurate release gate: bootstrap, gameplay compares, frame/audio oracle, full state sweep"

[tasks.project-status]
run = "cargo run -q -p wildside-cli -- project-status"
description = "Summarise repo health: 1P-playable first, 1P-accurate second, backlog risks and human blockers"

[tasks.backlog-lint]
run = "cargo run -q -p wildside-cli -- backlog-lint"
description = "Enforce backlog hygiene: NOW size, lean open-queue Verify cells, lane/status consistency (runs in verify-slice-fast)"

[tasks.asm-coverage-check-required]
run = "cargo run -q -p wildside-cli -- asm-coverage --check-required"
description = "Fail if required ASM labels lose native citations"

[tasks.asm-coverage-check-no-new-test-only]
run = "cargo run -q -p wildside-cli -- asm-coverage --check-no-new-test-only"
description = "Fail if any new ASM label becomes test-only debt outside the reviewed baseline"

[tasks.dead-code-ratchet]
run = "python3 scripts/dead_code_ratchet.py"
description = "#32 scoreboard: fail if #[cfg_attr(not(test), allow(dead_code))] count exceeds the baseline (downward-only ratchet)"

[tasks.completion-audit]
run = "cargo run -q -p wildside-cli -- project-status --fail-on-human-blockers"
description = "Fail until all source-port validation/repro blockers ([?]/[b] rows) are resolved by a human playtest"

[tasks.verify-audio-driver]
run = "scripts/strict-rust.sh cargo run -p wildside-cli -- verify-audio-driver"

[tasks.verify-audio-output]
run = "scripts/strict-rust.sh cargo run -p wildside-cli -- verify-audio-output --scenario boot-title-start-level1"

[tasks.render-frame]
run = "cargo run --release -p wildside-cli -- render-frame --steps 2000000 --out .cache/title-frame.png"

[tasks.run-sdl]
run = "cargo run --release -p wildside-cli -- run-sdl"

[tasks.dump-audio]
run = "cargo run -p wildside-cli -- dump-audio --scenario boot-title-start-level1 --out .cache/audio.wav"

[tasks.bootstrap-upstream]
run = "cargo run -p wildside-cli -- bootstrap-upstream"

[tasks.bootstrap-references]
run = "cargo run -p wildside-cli -- bootstrap-references"

[tasks.oracle-setup]
run = "cargo run -p wildside-cli -- oracle-setup"

[tasks.extract-assets]
run = "cargo run -p wildside-cli -- extract-assets"

[tasks.reference-build]
run = "cargo run -p wildside-cli -- reference-build"

[tasks.dump-level-layout]
run = "sh -c 'cargo run -p wildside-cli -- dump-level-layout --level \"${1:-00}\"' --"

[tasks.sweep]
run = "scripts/strict-rust.sh cargo run --release -p wildside-cli -- sweep"
description = "Sweep all 105 levels for native vs oracle parity"

[tasks.warm-cache]
run = "cargo run --release -p wildside-cli -- sweep --warm-cache-only"
description = "Pre-populate oracle cache for all levels (no native comparison)"

[tasks.perf-baseline]
run = "cargo bench -p wildside-core --bench frame_step"
description = "Run performance benchmarks (criterion); results in target/criterion/"

[tasks.sweep-gameplay]
run = "scripts/strict-rust.sh cargo run --release -p wildside-cli -- sweep --levels 0-104 --tier gameplay"
description = "Self-consistency gameplay sweep: walk-right + jump + stomp on all 69 BCD levels"

[tasks.collect-metrics]
run = """
mkdir -p .cache/metrics
echo "$(date -Iseconds) test_count=$(cargo test --workspace 2>&1 | grep -oP '\\d+ passed' | awk '{s+=int($1)}END{print s}') sweep_pass=$(cargo run --release -p wildside-cli -- sweep --levels 0-104 --tier state 2>&1 | grep -oP '\\d+ passed' | head -1 | awk '{print $1}') gameplay_pass=$(cargo run --release -p wildside-cli -- sweep --levels 0-104 --tier gameplay 2>&1 | grep -oP '\\d+ passed' | head -1 | awk '{print $1}') todo_fidelity=$(grep -r 'TODO(fidelity)' crates/ | wc -l) deviation=$(grep -r 'DEVIATION:' crates/ | wc -l)" >> .cache/metrics/history.log
tail -1 .cache/metrics/history.log
"""
description = "Collect sweep/test/annotation metrics to .cache/metrics/history.log"

[tasks.import-tas]
run = "cargo run -p wildside-cli -- import-tas --bk2 ${1:?usage: mise run import-tas <path.bk2>}"
description = "Import a BK2 TAS recording as a DynamicScenario JSON"

[tasks.verify-tas]
run = "scripts/strict-rust.sh cargo run --release -p wildside-cli -- verify-tas --scenario ${1:?usage: mise run verify-tas <scenario.json>}"
description = "Verify a TAS scenario against the oracle (native vs emulator)"

[tasks.view-tas]
# Intentionally runs without scripts/strict-rust.sh, for the same reason as
# verify-tas-frontier (clippy is the warning authority; RUSTFLAGS would fork a
# redundant release cache). The historical frame-951 determinism caveat was
# disproven 2026-06-21 (#25): byte-identical A/B builds.
# Two-stage fzf: pick scenario, then (only for runs over the viewer's 2000-frame
# default guard) pick a frame window. The `sh -c '...' --` wrapper makes mise's
# trailing CLI arg available as $1 (same pattern as the dump-level-layout task).
run = """
sh -c '
if ! command -v fzf >/dev/null 2>&1; then echo "view-tas needs fzf on PATH"; exit 1; fi
if ! command -v jq >/dev/null 2>&1; then echo "view-tas needs jq on PATH"; exit 1; fi
SCENARIO="${1:-}"
if [ -z "$SCENARIO" ]; then
  SCENARIO=$(ls tests/data/tas/*/scenario.json tests/data/dynamic-scenarios/*.json 2>/dev/null | fzf --prompt="scenario> ")
fi
if [ -z "$SCENARIO" ]; then echo "view-tas: no scenario selected"; exit 1; fi
if [ ! -f "$SCENARIO" ]; then echo "view-tas: no such scenario: $SCENARIO"; exit 1; fi
FRAME_COUNT=$(jq -r ".frame_count" "$SCENARIO")
MAX_DEFAULT=2000
ARGS="--scenario $SCENARIO"
if [ "$FRAME_COUNT" -gt "$MAX_DEFAULT" ]; then
  WINDOWS="whole run (slow)"
  START=0
  while [ "$START" -lt "$FRAME_COUNT" ]; do
    END=$((START + MAX_DEFAULT))
    if [ "$END" -gt "$FRAME_COUNT" ]; then END=$FRAME_COUNT; fi
    WINDOWS="$WINDOWS
$START-$END"
    START=$END
  done
  CHOICE=$(echo "$WINDOWS" | fzf --prompt="window> ")
  if [ -z "$CHOICE" ]; then echo "view-tas: no window selected"; exit 1; fi
  if [ "$CHOICE" = "whole run (slow)" ]; then
    ARGS="$ARGS --whole-run"
  else
    ARGS="$ARGS --frame-start ${CHOICE%-*} --frame-end ${CHOICE#*-}"
  fi
fi
cargo run --release -p wildside-cli -- view-tas $ARGS
' --
"""
description = "Open the SDL TAS viewer (fzf-pick scenario + frame window)"

[tasks.verify-tas-frontier]
# Intentionally runs without scripts/strict-rust.sh. Clippy is the warning
# authority (see verify-slice-fast / #24), so -D warnings adds no coverage here,
# and setting RUSTFLAGS would fork a redundant second release build cache.
# History: a "frame-951 divergence" (kid_y_vel +0x4001 vs +0x4000 under -D
# warnings during wall-cling right) was once suspected here as latent UB.
# Disproven 2026-06-21 (#25): a clean A/B build produced byte-identical binaries
# and a CRC-clean replay through frame 951 — it was a stale incremental-cache
# artefact, not a codegen bug. -D warnings is a lint level; it does not change
# codegen.
run = """
sh -ec '
FRONTIER=tests/tas_frontier.json
if [ ! -f "$FRONTIER" ]; then echo "missing $FRONTIER"; exit 1; fi
FAIL=0
for slug in $(jq -r '"'"'.recordings | keys[]'"'"' "$FRONTIER"); do
  scenario=$(jq -r --arg slug "$slug" ".recordings[\\$slug].scenario" "$FRONTIER")
  start=$(jq -r --arg slug "$slug" ".recordings[\\$slug].frame_start // 0" "$FRONTIER")
  frame=$(jq -r --arg slug "$slug" ".recordings[\\$slug].frontier_frame" "$FRONTIER")
  checkpoint_interval=$(jq -r --arg slug "$slug" ".recordings[\\$slug].checkpoint_interval // empty" "$FRONTIER")
  echo "checking $slug frames $start..$frame..."
  args="--scenario $scenario --frame-start $start --frame-end $frame"
  if [ -n "$checkpoint_interval" ]; then args="$args --checkpoint-interval $checkpoint_interval"; fi
  if ! cargo run --release -q -p wildside-cli -- verify-tas $args; then
    echo "FAIL: $slug verifier errored for frames $start..$frame"
    FAIL=1
    continue
  fi
  report=".cache/tas-verify/$slug/report.json"
  actual_summary=$(jq -cS '"'"'.divergence_summary'"'"' "$report")
  expected_summary=$(jq -cS --arg slug "$slug" '"'"'.recordings[$slug].expected_divergence_summary // {authoritative: 0, advisory: 0, accumulation: 0, rng: 0, oracle_limitation: 0}'"'"' "$FRONTIER")
  actual_first=$(jq -cS '"'"'.first_authoritative_diff | if . == null then null else {checkpoint, field} end'"'"' "$report")
  expected_first=$(jq -cS --arg slug "$slug" '"'"'.recordings[$slug].expected_first_authoritative_diff // null'"'"' "$FRONTIER")
  crc=$(jq -r '"'"'.first_crc_mismatch // empty'"'"' "$report")
  requested_crc_frames=$(jq -r '"'"'.crc_frame_counts.requested'"'"' "$report")
  native_crc_frames=$(jq -r '"'"'.crc_frame_counts.native'"'"' "$report")
  oracle_crc_frames=$(jq -r '"'"'.crc_frame_counts.oracle'"'"' "$report")
  expected_crc_frames=$((frame - start))
  if [ -n "$crc" ] || [ "$requested_crc_frames" -ne "$expected_crc_frames" ] || [ "$native_crc_frames" -ne "$expected_crc_frames" ] || [ "$oracle_crc_frames" -ne "$expected_crc_frames" ]; then
    echo "FAIL: $slug CRC regressed or coverage is incomplete in frames $start..$frame (first=${crc:-none} requested=$requested_crc_frames native=$native_crc_frames oracle=$oracle_crc_frames expected=$expected_crc_frames)"
    FAIL=1
  elif [ "$actual_summary" != "$expected_summary" ] || [ "$actual_first" != "$expected_first" ]; then
    echo "FAIL: $slug checkpoint divergence baseline changed in frames $start..$frame"
    echo "  expected summary: $expected_summary"
    echo "  actual summary:   $actual_summary"
    echo "  expected first:   $expected_first"
    echo "  actual first:     $actual_first"
    FAIL=1
  fi
done
if [ "$FAIL" -eq 1 ]; then echo "TAS frontier regression detected"; exit 1; fi
echo "TAS frontier: all recordings pass"
'
"""
description = "Local-first TAS frontier gate; verify no regression before current frontier frame"

[tasks.verify-tas-full]
# Omits scripts/strict-rust.sh for the same reason as verify-tas-frontier:
# clippy is the warning authority; RUSTFLAGS would fork a redundant release
# cache; the frame-951 caveat was disproven (#25).
run = """
sh -ec '
slug=any-percent-published
frontier=tests/tas_frontier.json
frame=$(jq -r --arg slug "$slug" '"'"'.recordings[$slug].total_frames'"'"' "$frontier")
checkpoint_interval=$(jq -r --arg slug "$slug" '"'"'.recordings[$slug].full_checkpoint_interval'"'"' "$frontier")
cargo run --release -q -p wildside-cli -- verify-tas --scenario tests/data/tas/$slug/scenario.json --frame-start 0 --frame-end "$frame" --checkpoint-interval "$checkpoint_interval" --frontier-kind gameplay --include-rng
report=.cache/tas-verify/$slug/report.json
crc=$(jq -r '"'"'.first_crc_mismatch // empty'"'"' "$report")
requested_crc_frames=$(jq -r '"'"'.crc_frame_counts.requested'"'"' "$report")
native_crc_frames=$(jq -r '"'"'.crc_frame_counts.native'"'"' "$report")
oracle_crc_frames=$(jq -r '"'"'.crc_frame_counts.oracle'"'"' "$report")
actual_summary=$(jq -cS '"'"'.divergence_summary'"'"' "$report")
expected_summary=$(jq -cS --arg slug "$slug" '"'"'.recordings[$slug].full_expected_divergence_summary'"'"' "$frontier")
actual_first=$(jq -cS '"'"'.first_authoritative_diff | if . == null then null else {checkpoint, field} end'"'"' "$report")
expected_first=$(jq -cS --arg slug "$slug" '"'"'.recordings[$slug].full_expected_first_authoritative_diff'"'"' "$frontier")
enemy_checkpoints=$(jq -r '"'"'.enemy_frontier.checkpoints'"'"' "$report")
actual_enemy_summary=$(jq -cS '"'"'.enemy_frontier.divergence_summary'"'"' "$report")
expected_enemy_summary=$(jq -cS --arg slug "$slug" '"'"'.recordings[$slug].full_expected_enemy_divergence_summary'"'"' "$frontier")
actual_enemy_first=$(jq -cS '"'"'.enemy_frontier.first_authoritative_diff | if . == null then null else {checkpoint, field} end'"'"' "$report")
expected_enemy_first=$(jq -cS --arg slug "$slug" '"'"'.recordings[$slug].full_expected_first_enemy_authoritative_diff'"'"' "$frontier")
actual_rng_digest=$(jq -r '"'"'.rng_divergence_digest // empty'"'"' "$report")
expected_rng_digest=$(jq -r --arg slug "$slug" '"'"'.recordings[$slug].full_expected_rng_divergence_digest'"'"' "$frontier")
actual_rng_frames=$(jq -cS '"'"'.rng_frame_comparison | {start_frame, compared_frames, mismatch_count, mismatch_digest, first_mismatch}'"'"' "$report")
expected_rng_frames=$(jq -cS --arg slug "$slug" '"'"'.recordings[$slug].full_expected_rng_frame_comparison'"'"' "$frontier")
rng_requested_frames=$(jq -r '"'"'.rng_frame_comparison.frame_counts.requested'"'"' "$report")
rng_native_frames=$(jq -r '"'"'.rng_frame_comparison.frame_counts.native'"'"' "$report")
rng_oracle_frames=$(jq -r '"'"'.rng_frame_comparison.frame_counts.oracle'"'"' "$report")
if [ -n "$crc" ]; then
  echo "FAIL: full TAS CRC regressed at frame $crc"
  exit 1
fi
if [ "$requested_crc_frames" -ne "$frame" ] || [ "$native_crc_frames" -ne "$frame" ] || [ "$oracle_crc_frames" -ne "$frame" ]; then
  echo "FAIL: full TAS CRC coverage incomplete (requested=$requested_crc_frames native=$native_crc_frames oracle=$oracle_crc_frames expected=$frame)"
  exit 1
fi
if [ "$rng_requested_frames" -ne "$frame" ] || [ "$rng_native_frames" -ne "$frame" ] || [ "$rng_oracle_frames" -ne "$frame" ]; then
  echo "FAIL: full TAS per-frame RNG coverage incomplete (requested=$rng_requested_frames native=$rng_native_frames oracle=$rng_oracle_frames expected=$frame)"
  exit 1
fi
if [ "$enemy_checkpoints" -ne "$frame" ]; then
  echo "FAIL: full TAS enemy-frontier coverage incomplete (actual=$enemy_checkpoints expected=$frame)"
  exit 1
fi
if [ "$actual_summary" != "$expected_summary" ] || [ "$actual_first" != "$expected_first" ] || [ "$actual_enemy_summary" != "$expected_enemy_summary" ] || [ "$actual_enemy_first" != "$expected_enemy_first" ] || [ "$actual_rng_digest" != "$expected_rng_digest" ] || [ "$actual_rng_frames" != "$expected_rng_frames" ]; then
  echo "FAIL: full TAS checkpoint divergence baseline changed"
  echo "  expected summary: $expected_summary"
  echo "  actual summary:   $actual_summary"
  echo "  expected first:   $expected_first"
  echo "  actual first:     $actual_first"
  echo "  expected enemy summary: $expected_enemy_summary"
  echo "  actual enemy summary:   $actual_enemy_summary"
  echo "  expected enemy first:   $expected_enemy_first"
  echo "  actual enemy first:     $actual_enemy_first"
  echo "  expected RNG digest: $expected_rng_digest"
  echo "  actual RNG digest:   $actual_rng_digest"
  echo "  expected per-frame RNG: $expected_rng_frames"
  echo "  actual per-frame RNG:   $actual_rng_frames"
  exit 1
fi
echo "Full TAS CRC: all $frame frames match; gameplay state remains clean; enemy frontier debt ratcheted ($actual_enemy_summary first=$actual_enemy_first); sampled and per-frame RNG baselines unchanged (rng_digest=$actual_rng_digest per_frame=$actual_rng_frames)"
'
"""
description = "Full any-percent TAS verification — run after gameplay-affecting commits"

[tasks.audit-debug-fields]
run = "python3 scripts/audit_debug_fields.py"
description = "Check that emitted debug fields are registered and stale candidates are promoted or exempted"

[tasks.mutants-file]
run = """
sh -ec '
FILE=${FILE:?usage: FILE=<module.rs> mise run mutants-file}
STEM=${FILE%.rs}
OUTPUT=${OUTPUT:-.cache/mutants/${STEM}}
rm -rf "$OUTPUT/mutants.out" "$OUTPUT/mutants.out.old"
KID_REPO_ROOT="$PWD" cargo mutants -p wildside-core -f "$FILE" -j 1 --gitignore=true --output "$OUTPUT" -- --lib -- --skip demo_ --skip published_tas --skip snapshot
'
"""
description = "Run cargo-mutants against a single wildside-core source file (FILE=<module.rs> mise run mutants-file), matching the rotation strategy's invocation"

[tasks.web-bundle]
run = "cargo run -p wildside-cli -- pack-web-bundle"
description = "Pack the extracted generated bundle into web/bundle.wsbndl for the browser build (#21; private delivery per #16)"

[tasks.web-build]
run = """
sh -ec '
cargo build --release -p wildside-web --target wasm32-unknown-unknown
wasm-bindgen --target web --no-typescript --out-dir web/pkg \
  target/wasm32-unknown-unknown/release/wildside_web.wasm
'
"""
description = "Build the wasm module + JS bindings into web/pkg (#19)"

[tasks.web-serve]
depends = ["web-build"]
# Loopback only; expose via `tsp up` if Tailnet access is wanted. The bundle
# ships derived assets, so never funnel this publicly (#16 decision).
# serve.py adds the COOP/COEP headers SharedArrayBuffer needs (audio, #20/#23).
run = """
sh -ec '
[ -f web/bundle.wsbndl ] || cargo run -p wildside-cli -- pack-web-bundle
python3 web/serve.py 8321
'
"""
description = "Serve the playable web build on http://127.0.0.1:8321 with COOP/COEP (builds wasm + packs bundle if missing)"

[tasks.clean-build]
run = "cargo clean"
description = "Remove Cargo build artefacts under target/"

[tasks.clean-cache]
run = "python3 scripts/cleanup_generated.py --balanced --skip-build"
description = "Prune generated cache artefacts while preserving expensive bootstrap/toolchain caches"

[tasks.clean-all]
run = """
sh -ec '
cargo clean
python3 scripts/cleanup_generated.py --aggressive --skip-build
'
"""
description = "Remove Cargo build artefacts plus aggressive generated-cache cleanup"
