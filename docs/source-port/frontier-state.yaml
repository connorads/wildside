        "reason": "`camera_y_pos` is NOT in `ADVISORY_FIELDS` — it is already authoritative-by-default. The 17 advisory diffs the autonomy advisory-promotion strategy flagged in sweep `1777679249` all came from the death-gap path in `classify_state_diff` (`crates/kidcli/src/sweep/mod.rs`) firing on checkpoints where the oracle was ALSO paused (`game_paused=true`, `current_level_id=0x0000`, `camera_y_pos=0x00730000` — title-card position). ASM `Camera_Y_pos = $FFFFF820` is written by gameplay routines (`sub_1B988` move.w #4, `loc_7B58` move.l, etc.); when the oracle never enters the level (warp paused, Start carryover), it can't produce a meaningful Camera_Y_pos to compare against, regardless of native lifecycle. The fix was architectural: reorder `classify_state_diff` so oracle-paused supersedes death-gap. After the reorder, those 17 diffs reclassify to `oracle_limitation` (already non-blocking) and the autonomy strategy stops surfacing the field. Removing `camera_y_pos` from advisory or adding it to `ADVISORY_FIELDS` would have masked legitimate authoritative diffs in real death-gap scenarios where the oracle survives. The same precedence change applies symmetrically to `kid_x_pos`, `kid_y_pos`, `camera_x_pos`."
