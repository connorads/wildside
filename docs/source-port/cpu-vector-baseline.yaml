# Downward-only 68000 conformance baseline — the #447 meter.
#
# One row per (vector set)/(opcode file): `[state_fail, cycle_fail]` out of every
# vector in that file, as measured by `mise run verify-cpu-vectors`.
# `scripts/cpu_vector_ratchet.py` fails if any row exceeds its baseline (a new
# failure), and `--update` lowers rows as they improve. The set only shrinks.
#
# These counts are NOT accepted behaviour and NOT all r68k's fault. Read them
# with `docs/source-port/cpu-core-conformance.md`, which attributes them:
#
#   - ~194k/77k of the 680x0/m68000 rows are exception-dispatch vectors, where
#     r68k's group-0/1/2 stack frames diverge systematically (one root cause).
#   - ~117k m68000 rows are the absent trace bit, which r68k does not model.
#   - ~3.7k 680x0 rows are the ASR shift-count-overflow flag dispute, where the
#     m68000 set passes r68k on the same instructions — a vector-set
#     disagreement, not a core defect.
#   - The cycle column is dominated by MULU/MULS/DIVU/DIVS, where r68k charges a
#     flat cycle count for a data-dependent instruction.
#
# Provenance is enforced, not decorative: the ratchet refuses to compare or
# shrink when any value below differs from the run, because a different vector
# or r68k revision is a different measurement. Re-seed with `--reseed`.
