# Failing-test ratchet baseline for the ungated `wildside-cli` suite (#417).
#
# Downward-only: this is the reviewed set of `cargo test -p wildside-cli` tests
# known to fail on `main`. `scripts/failing_test_ratchet.py` fails the commit if
# any test fails outside this set (a new regression), and `--update` (the hk
# `failing-test-ratchet` fix step) drops tests as they are fixed. The set only
# shrinks; it must never grow.
#
# These are grandfathered rot from an ungated suite (#417), NOT accepted
# behaviour. Remove a test here in the SAME commit that fixes it (or `#[ignore]`s
# it with a re-derivation note per AGENTS.md). Triage each cluster in #417.
#
# libtest emits the `failures:` summary alphabetically sorted, so this list is
# diff-stable when re-seeded.
