strategies:
  - name: root-cause-backlog
    enabled: true
    # Backlog items whose summary contains this marker are ready to implement
    root_cause_marker: "Root cause identified"

  - name: enemy-family-audit
    enabled: true
    # Ordered by backlog overlap, then gap size
    priority_order:
      - enemy_tank
      - enemy_tank_shooting
      - enemy_mini_hopping_skull
      - enemy_drips
      - enemy_tar_monster
      - enemy_ninja
      - enemy_fireball
      - enemy_armadillo
      - enemy_diamond
      - enemy_emo_rock
      - enemy_sphere

  - name: loc-coverage-drive
    enabled: true
    # Keep Ralph-loop source-port iterations commit-sized. The remaining
    # uncovered loc_ clusters are small, and waiting for clusters of three
    # falls through to the long-running mutation lane instead.
    min_cluster_size: 1
    # Empty = all subsystems; could focus on kid_main or block code
    focus_subsystems: []
    # Cap cite-only commits per autonomy session so loc-coverage-drive does
    # not absorb every cycle once the rotation stalls; the cascade advances
    # to mutation-testing/enemy-family-audit instead.
    max_per_session: 2

  - name: mutation-testing
    # Sharded rotation: each cycle runs `cargo mutants -f <file>` on the
    # current rotation entry and advances the pointer at
    # .cache/autonomy/proactive-verification/mutation-pointer.json once the
    # run completes without survivors. max_candidates_per_cycle time-boxes
    # large files (enemies.rs enumerates thousands of candidates, level.rs
    # has ~18k LOC and will similarly generate a large mutant set).
    #
    # The first 5 entries wrapped with zero survivors across ~836 mutants,
    # so the loop correctly declared the rotation exhausted. helmets.rs,
    # level.rs, and movement.rs extend the rotation to re-open the strategy
    # and give later cycles real test-gap work to triage.
    enabled: true
    output_dir: .cache/mutants
    rotation:
      - enemies.rs
      - combat.rs
      - blocks.rs
      - physics.rs
      - terrain.rs
      - helmets.rs
      - level.rs
      - movement.rs
    max_candidates_per_cycle: 200
    targets:
      - { module: enemies.rs, package: kid-core, tier: 1 }
      - { module: combat.rs, package: kid-core, tier: 1 }
      - { module: blocks.rs, package: kid-core, tier: 1 }
      - { module: physics.rs, package: kid-core, tier: 2 }
      - { module: terrain.rs, package: kid-core, tier: 2 }
      - { module: helmets.rs, package: kid-core, tier: 1 }
      - { module: level.rs, package: kid-core, tier: 2 }
      - { module: movement.rs, package: kid-core, tier: 1 }
