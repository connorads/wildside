strategies:
  - name: root-cause-backlog
    enabled: true
    # Backlog items whose summary contains this marker are ready to implement
    root_cause_marker: "Root cause identified"

  - name: enemy-family-audit
    enabled: true
    # Ordered by backlog overlap, then gap size
    priority_order:
      - enemy_tank
      - enemy_tank_shooting
      - enemy_mini_hopping_skull
      - enemy_drips
      - enemy_tar_monster
      - enemy_ninja
      - enemy_fireball
      - enemy_armadillo
      - enemy_diamond
      - enemy_emo_rock
      - enemy_sphere

  - name: loc-coverage-drive
    enabled: true
    # Keep Ralph-loop source-port iterations commit-sized. The remaining
    # uncovered loc_ clusters are small, and waiting for clusters of three
    # falls through to the long-running mutation lane instead.
    min_cluster_size: 1
    # Empty = all subsystems; could focus on kid_main or block code
    focus_subsystems: []
    # Cap cite-only commits per autonomy session so loc-coverage-drive does
    # not absorb every cycle once the rotation stalls; the cascade advances
    # to mutation-testing/enemy-family-audit instead.
    max_per_session: 2

  - name: mutation-testing
    # Sharded rotation: each cycle runs `cargo mutants -f <file>` on the
    # current rotation entry and advances the pointer at
    # .cache/autonomy/proactive-verification/mutation-pointer.json once the
    # run completes without survivors. max_candidates_per_cycle time-boxes
    # large files (enemies.rs enumerates thousands of candidates, level.rs
    # has ~18k LOC and will similarly generate a large mutant set).
    #
    # The first 5 entries wrapped with zero survivors across ~836 mutants,
    # so the loop correctly declared the rotation exhausted. helmets.rs,
    # level.rs, and movement.rs extend the rotation to re-open the strategy
    # and give later cycles real test-gap work to triage. platforms.rs,
    # projectiles.rs, weather.rs, and vdp.rs extend it again on 2026-05-04
    # to cover gameplay modules that have never been mutation-tested.
    # kid-render targets extend it on 2026-05-20 after the source-port
    # frontier and kid-core proactive lanes both reported all-exhausted; these
    # cover visual-fidelity code paths where remaining source-port debt is
    # expected to surface. trace.rs extends the source-port fidelity rotation
    # after the next package still reported all-exhausted while trace helpers
    # had concrete cargo-mutants candidates. hud.rs extends the renderer visual
    # lane after HUD icons/pips received several source-port fidelity fixes but
    # were not part of the mutation rotation. kid-data level_layout.rs adds a
    # pure asset/layout extraction lane for ASM-backed source-port tooling.
    # kid-rom lib.rs covers deterministic ROM header validation used before
    # oracle/source-port asset extraction.
    enabled: true
    output_dir: .cache/mutants
    rotation:
      - enemies.rs
      - combat.rs
      - blocks.rs
      - physics.rs
      - terrain.rs
      - helmets.rs
      - level.rs
      - movement.rs
      - platforms.rs
      - projectiles.rs
      - weather.rs
      - vdp.rs
      - gfx_animation.rs
      - demo.rs
      - scenario.rs
      - trace.rs
      - bundle.rs
      - lib.rs
      - background.rs
      - kid-render:level.rs
      - player.rs
      - palette.rs
      - tiles.rs
      - hud.rs
      - kid-data:level_layout.rs
      - kid-rom:lib.rs
    max_candidates_per_cycle: 200
    targets:
      - { module: enemies.rs, package: kid-core, tier: 1 }
      - { module: combat.rs, package: kid-core, tier: 1 }
      - { module: blocks.rs, package: kid-core, tier: 1 }
      - { module: physics.rs, package: kid-core, tier: 2 }
      - { module: terrain.rs, package: kid-core, tier: 2 }
      - { module: helmets.rs, package: kid-core, tier: 1 }
      - { module: level.rs, package: kid-core, tier: 2 }
      - { module: movement.rs, package: kid-core, tier: 1 }
      - { module: platforms.rs, package: kid-core, tier: 1 }
      - { module: projectiles.rs, package: kid-core, tier: 1 }
      - { module: weather.rs, package: kid-core, tier: 2 }
      - { module: vdp.rs, package: kid-core, tier: 3 }
      - { module: gfx_animation.rs, package: kid-core, tier: 3 }
      - { module: demo.rs, package: kid-core, tier: 2 }
      - { module: scenario.rs, package: kid-core, tier: 2 }
      - { module: trace.rs, package: kid-core, tier: 1 }
      - { module: bundle.rs, package: kid-render, tier: 1 }
      - { module: lib.rs, package: kid-render, tier: 1 }
      - { module: background.rs, package: kid-render, tier: 2 }
      - { module: level.rs, package: kid-render, tier: 2 }
      - { module: player.rs, package: kid-render, tier: 2 }
      - { module: palette.rs, package: kid-render, tier: 2 }
      - { module: tiles.rs, package: kid-render, tier: 2 }
      - { module: hud.rs, package: kid-render, tier: 2 }
      - { module: level_layout.rs, package: kid-data, tier: 2 }
      - { module: lib.rs, package: kid-rom, tier: 2 }

  - name: advisory-promotion
    # Surface stable advisory-category diffs from `.cache/sweep-runs/`.
    # The strategy never mutates `ADVISORY_FIELDS` itself — it emits a task
    # asking the next agent to either promote the field to authoritative
    # (delete it from `ADVISORY_FIELDS` in `crates/kidcli/src/sweep/mod.rs`)
    # or record a rejected_hypothesis entry in `frontier-state.yaml`
    # explaining why it must remain advisory.
    #
    # `min_persistence_sweeps` is clamped to the number of reports actually
    # present, so a fresh clone with a single sweep still surfaces work;
    # once a long history exists, only diffs that have persisted across
    # the last N runs are considered stable enough to review.
    enabled: true
    diffs_dir: .cache/sweep-runs
    min_persistence_sweeps: 3
