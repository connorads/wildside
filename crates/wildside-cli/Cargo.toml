[package]
name = "wildside-cli"
edition.workspace = true
license.workspace = true
version.workspace = true

[lints]
workspace = true

[[bin]]
name = "wildside"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
crc32fast.workspace = true
hound.workspace = true
image.workspace = true
wildside-core = { path = "../wildside-core" }
wildside-data = { path = "../wildside-data" }
wildside-md = { path = "../wildside-md" }
wildside-render = { path = "../wildside-render" }
wildside-rom = { path = "../wildside-rom" }
rayon.workspace = true
sdl2 = { version = "0.38.0", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha1.workspace = true
tempfile.workspace = true
toml = "0.8.23"
zip = { version = "8.2", default-features = false, features = ["deflate"] }
font8x8 = "0.3.1"
ymfm-sys = { path = "../ymfm-sys" }
ratatui.workspace = true
crossterm.workspace = true
