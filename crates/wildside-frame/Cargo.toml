[package]
name = "wildside-frame"
edition.workspace = true
license.workspace = true
version.workspace = true

[features]
# The trace→GEMS audio director logic is feature-free; `audio` only adds the
# real GemsAudioEngine sink implementation (wildside-md's C++/ymfm machine
# emulation), which wasm builds opt into once zig is available (#20).
audio = ["dep:wildside-md", "wildside-md/audio"]

[lints]
workspace = true

[dependencies]
font8x8 = "0.3.1"
serde.workspace = true
wildside-core = { path = "../wildside-core" }
wildside-data = { path = "../wildside-data" }
wildside-md = { path = "../wildside-md", default-features = false, optional = true }
wildside-render = { path = "../wildside-render" }
