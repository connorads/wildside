[package]
name = "wildside-web"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
# cdylib is the wasm module; rlib keeps the session logic natively testable
# (the capture-frames parity test runs on the host).
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
sha1.workspace = true
# Exact pin: the wasm-bindgen crate and the wasm-bindgen-cli tool in .mise.toml
# must be the same version or `wasm-bindgen` refuses the module. Bump both together.
wasm-bindgen = "=0.2.126"
wildside-core = { path = "../wildside-core" }
wildside-data = { path = "../wildside-data" }
# frame/audio pulls in wildside-md's GEMS machine emulation (ymfm-sys now
# cross-compiles for bare wasm via zig, see ymfm-sys build.rs) so the browser
# session drives the same NativeAudioDirector as the native player (#20).
wildside-frame = { path = "../wildside-frame", features = ["audio"] }
# default-features = false keeps the direct dependency on the pure-Rust VDP
# renderer; the machine-emulation `audio` feature arrives via frame/audio.
wildside-md = { path = "../wildside-md", default-features = false }
wildside-render = { path = "../wildside-render" }
wildside-rom = { path = "../wildside-rom" }
