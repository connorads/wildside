[package]
name = "wildside-core"
edition.workspace = true
license.workspace = true
version.workspace = true

[features]
# Harness API: probes, seeds, warps, the raster scheduler and ScriptRunner.
# Tools (cli) and tests drive the engine through it; production shells use
# NativeRuntime::boot + step_frame only.
harness = []

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
crc32fast.workspace = true
serde.workspace = true
serde_json.workspace = true
wildside-data = { path = "../wildside-data" }

[dev-dependencies]
proptest = "1.6"
insta = { version = "1.42", features = ["yaml", "redactions"] }
criterion.workspace = true

[[bench]]
name = "frame_step"
harness = false
