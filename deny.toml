[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "BSL-1.0",
    "0BSD",
    "Zlib",
    "Unlicense",
    "Unicode-3.0",
    "LGPL-2.1-or-later",
]

[[licenses.clarify]]
crate = "r68k-common"
expression = "MIT"
license-files = [{ path = "../LICENSE.md", hash = 0 }]

[[licenses.clarify]]
crate = "r68k-emu"
expression = "MIT"
license-files = [{ path = "../LICENSE.md", hash = 0 }]

[advisories]
ignore = [
    # paste is unmaintained but ratatui still depends on it; no safe upgrade yet
    "RUSTSEC-2024-0436",
]

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/marhel/r68k"]
