<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wildside</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #111;
        color: #ddd;
        font-family: ui-monospace, monospace;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
      }
      /* 320x224 backing store; CSS scales it with nearest-neighbour so the
         pixel art stays crisp (integer-ish letterbox via object-fit). */
      canvas {
        image-rendering: pixelated;
        width: min(96vw, calc(92vh * 320 / 224));
        aspect-ratio: 320 / 224;
        background: #000;
      }
      #status {
        min-height: 1.2em;
      }
      #keys {
        color: #888;
        font-size: 0.8rem;
      }
    </style>
  </head>
  <body>
    <canvas id="screen" width="320" height="224"></canvas>
    <div id="status">loading…</div>
    <div id="keys">
      arrows/WASD move · Z/space = B (jump) · X = C · C/shift = A · enter = start
    </div>
    <script type="module" src="main.js"></script>
  </body>
</html>
