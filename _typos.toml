[files]
extend-exclude = ["third_party/", "*.lock"]

[default.extend-words]
# Hex addresses and ASM labels (BA, DAA, DBE, ABD, AFE, EDE, FO, PN)
BA = "BA"
ba = "ba"
DAA = "DAA"
daa = "daa"
DBE = "DBE"
dbe = "dbe"
ABD = "ABD"
abd = "abd"
AFE = "AFE"
afe = "afe"
EDE = "EDE"
FO = "FO"
PN = "PN"

# Original ROM labels preserved faithfully
damge = "damge"
entrys = "entrys"
Ded = "Ded"
# ROM symbol sfx_Socre_counter — original misspelling; docs reference it verbatim
Socre = "Socre"

# Tokeniser false positives
# "mis-" prefix (mis-detects, mis-keyed): hyphen split flags bare "mis"
mis = "mis"
# "MATCHes" splits at the uppercase-run/lowercase boundary into MATC + Hes
MATC = "MATC"

# Crate names
ratatui = "ratatui"

# Hardware/audio terms
nd = "nd"
